[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
markers =
    ft: tests fonctionnels (happy path)
    et: tests d'erreur (entrees invalides)
    bt: tests aux limites (boundary)
    pt: tests de permissions / controle d'acces
    bug: test qui documente un defaut connu (xfail)
